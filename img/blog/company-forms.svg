<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <defs>
    <linearGradient id="bgForms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2d44"/>
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#bgForms)"/>
  <!-- Three columns: IE / LLC / JSC -->
  <g transform="translate(200,140)" opacity="0.35">
    <rect x="-20" y="-32" width="40" height="64" fill="none" stroke="#b08d57" stroke-width="2" rx="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#b08d57">IE</text>
  </g>
  <g transform="translate(300,130)" opacity="0.55">
    <rect x="-28" y="-42" width="56" height="84" fill="none" stroke="#c9a76c" stroke-width="2.5" rx="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#c9a76c">LLC</text>
  </g>
  <g transform="translate(400,140)" opacity="0.35">
    <rect x="-24" y="-32" width="48" height="64" fill="none" stroke="#b08d57" stroke-width="2" rx="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#b08d57">JSC</text>
  </g>
  <!-- Balance / scale hint -->
  <g transform="translate(300, 210)" opacity="0.18">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#c9a76c" stroke-width="1.5"/>
    <line x1="-60" y1="0" x2="-60" y2="10" stroke="#c9a76c" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="10" stroke="#c9a76c" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#c9a76c" stroke-width="1.5"/>
    <circle cx="0" cy="-12" r="3" fill="#c9a76c"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="80" cy="60" r="3" fill="#b08d57" opacity="0.2"/>
  <circle cx="520" cy="220" r="3" fill="#b08d57" opacity="0.2"/>
  <circle cx="150" cy="240" r="2" fill="#b08d57" opacity="0.15"/>
  <circle cx="450" cy="50" r="2" fill="#b08d57" opacity="0.15"/>
  <!-- Accent line -->
  <rect x="40" y="240" width="24" height="2" rx="1" fill="#b08d57" opacity="0.3"/>
</svg>
